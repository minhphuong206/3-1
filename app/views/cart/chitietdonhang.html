<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng Thành Công | PhươngSTORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-wrapper">
            <a href="index.html" class="logo">Phương<span style="color:white">STORE</span></a>
        </div>
    </header>

    <main class="success-wrapper">
        <div class="success-box">
            <i class="fa-solid fa-circle-check icon-success"></i>
            
            <h1 style="color: var(--gold-color); margin-bottom: 10px;">Đặt Hàng Thành Công!</h1>
            <p style="color: var(--text-gray); margin-bottom: 20px;">Cảm ơn bạn đã mua sắm tại PhươngSTORE.</p>
            
            <div class="order-id">Mã đơn hàng: <span>#DH20241025</span></div>

            <div style="background: #222; padding: 20px; border-radius: 10px;">
                <h3 style="text-align: left; color: white; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px;">Chi tiết đơn hàng</h3>
                <table class="order-summary-table">
                    <tr>
                        <td>iPhone 15 Pro Max (x1)</td>
                        <td style="text-align: right;">28.990.000đ</td>
                    </tr>
                    <tr>
                        <td>AirPods Pro 2 (x1)</td>
                        <td style="text-align: right;">5.290.000đ</td>
                    </tr>
                    <tr>
                        <td>Phí vận chuyển</td>
                        <td style="text-align: right;">Miễn phí</td>
                    </tr>
                    <tr>
                        <td><strong>TỔNG CỘNG</strong></td>
                        <td style="text-align: right; color: var(--gold-color);"><strong>34.280.000đ</strong></td>
                    </tr>
                </table>
            </div>

            <div style="margin-top: 30px; display: flex; gap: 15px;">
                <a href="index.html" class="btn-primary">Tiếp Tục Mua Sắm</a>
                
            </div>
        </div>
    </main>

</body>
</html>
